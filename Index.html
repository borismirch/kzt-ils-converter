<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ממיר טנגה ⇄ שקלים | KZT ↔ ILS</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #1a202c;
            --primary: #3182ce;
            --primary-dark: #2b6cb0;
            --accent: #38a169;
            --border: #e2e8f0;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        [data-theme="dark"] {
            --bg: #1a202c;
            --card: #2d3748;
            --text: #f7fafc;
            --primary: #63b3ed;
            --primary-dark: #4299e1;
            --accent: #48bb78;
            --border: #4a5568;
            --shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Heebo", "Arial", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            background: var(--card);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 32px;
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border);
        }
        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 1.6rem;
            font-weight: 700;
        }
        .rate-info {
            text-align: center;
            color: #718096;
            font-size: 0.88rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .rate-line {
            white-space: nowrap;
            display: inline-block;
        }
        [data-theme="dark"] .rate-info { color: #a0aec0; }
        .converter {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .input-group {
            position: relative;
        }
        .input-wrapper {
            position: relative;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 14px 48px 14px 16px;
            font-size: 1.3rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: transparent;
            color: var(--text);
            outline: none;
            transition: border 0.2s;
            text-align: right;
        }
        input[type="number"]:focus {
            border-color: var(--primary);
        }
        .currency-symbol {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-weight: 600;
            color: #718096;
            pointer-events: none;
            font-size: 1.25rem;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-accent {
            background: var(--accent);
            color: white;
        }
        .btn-accent:hover { opacity: 0.9; }
        .quick-amounts {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 10px 0 4px;
        }
        .quick-amounts button {
            padding: 6px 12px;
            font-size: 0.85rem;
            background: var(--border);
            color: var(--text);
        }
        [data-theme="dark"] .quick-amounts button { background: #4a5568; }
        .result {
            background: linear-gradient(135deg, var(--primary), #805ad5);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-top: 16px;
            font-size: 1.4rem;
            font-weight: 700;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .history {
            margin-top: 24px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history h3 { margin: 0 0 10px; font-size: 1rem; }
        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        .theme-toggle {
            position: fixed;
            top: 16px;
            left: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
        }
        [dir="rtl"] .theme-toggle { left: auto; right: 16px; }
        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.8rem;
            color: #718096;
        }
    </style>
</head>
<body>
    <div class="theme-toggle" onclick="toggleTheme()" title="החלף מצב בהיר/כהה">🌙</div>

    <div class="container">
        <h1>ממיר טנגה ⇄ שקלים</h1>
        <div class="rate-info">
            <div class="rate-line">שער נוכחי: 1 ₸ = 0.006835 ₪ &nbsp;|&nbsp; 1 ₪ = 146.3 ₸</div>
            <div>מקור: הבנק הלאומי של קזחסטן (18.10.2026)</div>
        </div>

        <div class="converter">
            <div class="input-group">
                <label for="amountKZT">סכום בטנגה (₸)</label>
                <div class="input-wrapper">
                    <input type="number" id="amountKZT" placeholder="0" step="any" inputmode="decimal">
                    <span class="currency-symbol">₸</span>
                </div>
                <div class="quick-amounts">
                    <span style="font-size:0.85rem; opacity:0.8; width:100%; text-align:center; margin-bottom:4px;">סכומים מהירים בטנגה:</span>
                    <button onclick="setQuickKZT(100)">100</button>
                    <button onclick="setQuickKZT(500)">500</button>
                    <button onclick="setQuickKZT(1000)">1,000</button>
                    <button onclick="setQuickKZT(5000)">5,000</button>
                    <button onclick="setQuickKZT(10000)">10,000</button>
                    <button onclick="setQuickKZT(50000)">50,000</button>
                </div>
            </div>

            <div style="text-align:center;">
                <button class="btn-secondary" onclick="swapCurrencies()">⇅ החלף</button>
            </div>

            <div class="input-group">
                <label for="amountILS">סכום בשקלים (₪)</label>
                <div class="input-wrapper">
                    <input type="number" id="amountILS" placeholder="0" step="any" inputmode="decimal">
                    <span class="currency-symbol">₪</span>
                </div>
            </div>

            <div class="actions">
                <button class="btn-accent" onclick="copyResult()">העתק תוצאה</button>
                <button class="btn-secondary" onclick="resetForm()">איפוס</button>
                <button class="btn-primary" onclick="clearHistory()">נקה היסטוריה</button>
            </div>

            <div class="result" id="resultDisplay">הזן סכום להמרה</div>
        </div>

        <div class="history">
            <h3>המרות אחרונות</h3>
            <div id="historyList"></div>
        </div>

        <footer>
            ממיר פשוט ונוח · שער מעודכן לפי נתונים רשמיים<br>
            <strong>נוצר על ידי בוריס מירץ'</strong>
        </footer>
    </div>

    <script>
        const RATE_KZT_TO_ILS = 1 / 146.3; // ≈ 0.0068353
        const RATE_ILS_TO_KZT = 146.3;

        const amountKZT = document.getElementById('amountKZT');
        const amountILS = document.getElementById('amountILS');
        const resultDisplay = document.getElementById('resultDisplay');
        const historyList = document.getElementById('historyList');

        let lastEdited = 'KZT';

        amountKZT.addEventListener('input', () => {
            lastEdited = 'KZT';
            convert();
        });
        amountILS.addEventListener('input', () => {
            lastEdited = 'ILS';
            convert();
        });

        function convert() {
            const kzt = parseFloat(amountKZT.value) || 0;
            const ils = parseFloat(amountILS.value) || 0;

            if (lastEdited === 'KZT') {
                const result = kzt * RATE_KZT_TO_ILS;
                amountILS.value = result ? result.toFixed(4) : '';
                resultDisplay.textContent = kzt ? `${kzt.toLocaleString()} ₸ = ${result.toFixed(2)} ₪` : 'הזן סכום להמרה';
            } else {
                const result = ils * RATE_ILS_TO_KZT;
                amountKZT.value = result ? result.toFixed(2) : '';
                resultDisplay.textContent = ils ? `${ils.toLocaleString()} ₪ = ${result.toLocaleString(undefined,{maximumFractionDigits:0})} ₸` : 'הזן סכום להמרה';
            }

            if (kzt || ils) saveToHistory();
        }

        function setQuickKZT(val) {
            amountKZT.value = val;
            lastEdited = 'KZT';
            convert();
        }

        function swapCurrencies() {
            const temp = amountKZT.value;
            amountKZT.value = amountILS.value;
            amountILS.value = temp;
            lastEdited = lastEdited === 'KZT' ? 'ILS' : 'KZT';
            convert();
        }

        function resetForm() {
            amountKZT.value = '';
            amountILS.value = '';
            resultDisplay.textContent = 'הזן סכום להמרה';
            lastEdited = 'KZT';
        }

        function copyResult() {
            const text = resultDisplay.textContent;
            if (text && text !== 'הזן סכום להמרה') {
                navigator.clipboard.writeText(text).then(() => {
                    const original = resultDisplay.textContent;
                    resultDisplay.textContent = 'הועתק! ✓';
                    setTimeout(() => resultDisplay.textContent = original, 1500);
                });
            }
        }

        function saveToHistory() {
            const entry = resultDisplay.textContent;
            if (!entry || entry === 'הזן סכום להמרה' || entry.includes('הועתק')) return;

            let history = JSON.parse(localStorage.getItem('kztIlsHistory') || '[]');
            history.unshift({ text: entry, time: new Date().toLocaleTimeString('he-IL') });
            history = history.slice(0, 8);
            localStorage.setItem('kztIlsHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('kztIlsHistory') || '[]');
            historyList.innerHTML = history.length 
                ? history.map(h => `<div class="history-item"><span>${h.text}</span><small>${h.time}</small></div>`).join('')
                : '<div style="opacity:0.6; text-align:center;">אין היסטוריה עדיין</div>';
        }

        function clearHistory() {
            localStorage.removeItem('kztIlsHistory');
            renderHistory();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            document.querySelector('.theme-toggle').textContent = isDark ? '🌙' : '☀️';
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        // Init
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }
        renderHistory();

        // Focus first input
        amountKZT.focus();
    </script>
</body>
</html>
